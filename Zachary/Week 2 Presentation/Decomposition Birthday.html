<!DOCTYPE html>

<head>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
        }

        /* Viewport & Canvas styling */
        #viewport {
            width: 100vw;
            height: calc(100vh - 110px);
            cursor: grab;
            overflow: hidden;
            position: relative;
            background-color: #0b0f19;
            background-image: radial-gradient(#1e293b 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #canvas {
            position: absolute;
            transform-origin: 0 0;
            top: 0;
            left: 0;
            width: 12000px;
            height: 12000px;
        }

        /* Connecting SVG Lines Layer */
        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .tree-line {
            fill: none;
            stroke: #475569;
            stroke-width: 2.5px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        /* Node Elements Styling */
        .node-container {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .node-card {
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13.5px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.35;
            border: 1.5px solid transparent;
            word-break: break-word;
        }

        .node-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7);
        }

        /* Color Coding based on reference specs */
        /* Root Node: Orange (#ea580c) */
        .node-root {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: #ffffff;
            border-color: #ffedd5;
            font-size: 16px;
            font-weight: 800;
            padding: 14px 24px;
            border-radius: 10px;
        }

        /* Major Classes & Subproblems: Dark Blue (#1e3a8a / #1d4ed8) */
        .node-major {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            color: #ffffff;
            border-color: #93c5fd;
            font-size: 14.5px;
            font-weight: 700;
            padding: 12px 18px;
        }

        .node-subproblem {
            background: linear-gradient(135deg, #1e293b 0%, #1e3a8a 100%);
            color: #ffffff;
            border-color: #60a5fa;
            font-size: 13.5px;
            font-weight: 600;
        }

        /* Action Steps / Special Highlight */
        .node-action-orange {
            background: linear-gradient(135deg, #ea580c 0%, #9a3412 100%);
            color: #ffffff;
            border-color: #fed7aa;
            font-size: 13.5px;
            font-weight: 700;
        }

        /* Tasks / Leaf Nodes: Yellow (#fef08a) with dark readable text */
        .node-leaf {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            color: #0f172a;
            border-color: #facc15;
            font-size: 13px;
            font-weight: 700;
        }

        /* Toggle Badge for expanding/collapsing */
        .toggle-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            margin-left: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Search Match Pulsing Effect */
        .search-match {
            outline: 3px solid #ef4444 !important;
            box-shadow: 0 0 25px #ef4444 !important;
            animation: pulseMatch 1.2s infinite alternate;
        }

        @keyframes pulseMatch {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>

        // Global State Variables
        let zoom = 0.8;

        // Spacing & Sizing Constants
        const NODE_WIDTH = 200;
        const NODE_HEIGHT = 44;
        const H_GAP = 28;
        const V_GAP = 52;

        /**
         * Tree layout algorithm calculating exact X positions
         */
        function computeLayout(node, depth = 0, xOffset = 0) {
            node.width = NODE_WIDTH;
            node.height = NODE_HEIGHT;
            node.depth = depth;

            if (!node.expanded || !node.children || node.children.length === 0) {
                node.treeWidth = NODE_WIDTH;
                node.x = xOffset;
                return node.treeWidth;
            }

            let currentX = xOffset;
            let totalChildrenWidth = 0;

            node.children.forEach((child) => {
                const childWidth = computeLayout(child, depth + 1, currentX);
                currentX += childWidth + H_GAP;
                totalChildrenWidth += childWidth;
            });

            totalChildrenWidth += (node.children.length - 1) * H_GAP;
            node.treeWidth = Math.max(NODE_WIDTH, totalChildrenWidth);
            node.x = xOffset + (node.treeWidth - NODE_WIDTH) / 2;

            return node.treeWidth;
        }

        /**
         * Assigns Y depth coordinates based on hierarchy level
         */
        function assignYPositions(node, currentY = 40) {
            node.y = currentY;
            if (node.expanded && node.children) {
                node.children.forEach(child => {
                    assignYPositions(child, currentY + NODE_HEIGHT + V_GAP);
                });
            }
        }

        /**
         * Main Render Function
         */
        function renderTree() {
            computeLayout(treeData, 0, 80);
            assignYPositions(treeData, 40);

            nodesLayer.innerHTML = '';
            svgLayer.innerHTML = '';

            const visibleNodes = [];
            const connections = [];

            function traverse(node) {
                visibleNodes.push(node);
                if (node.expanded && node.children) {
                    node.children.forEach(child => {
                        connections.push({ parent: node, child: child });
                        traverse(child);
                    });
                }
            }
            traverse(treeData);

            // Render Node Cards
            visibleNodes.forEach(node => {
                const wrapper = document.createElement('div');
                wrapper.className = 'node-container';
                wrapper.style.left = `${node.x}px`;
                wrapper.style.top = `${node.y}px`;
                wrapper.style.width = `${NODE_WIDTH}px`;

                const card = document.createElement('div');
                let typeClass = 'node-subproblem';
                if (node.type === 'root') typeClass = 'node-root';
                else if (node.type === 'major') typeClass = 'node-major';
                else if (node.type === 'action') typeClass = 'node-action-orange';
                else if (node.type === 'leaf') typeClass = 'node-leaf';

                card.className = `node-card ${typeClass} ${matchingNodeIds.has(node.id) ? 'search-match' : ''}`;
                card.innerText = node.title;

                const hasChildren = node.children && node.children.length > 0;
                if (hasChildren) {
                    const toggle = document.createElement('span');
                    toggle.className = 'toggle-badge';
                    toggle.innerText = node.expanded ? '−' : '+';
                    card.appendChild(toggle);

                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        node.expanded = !node.expanded;
                        renderTree();
                    });
                }

                wrapper.appendChild(card);
                nodesLayer.appendChild(wrapper);
            });

            // Render Orthogonal Connectors
            connections.forEach(conn => {
                const px = conn.parent.x + NODE_WIDTH / 2;
                const py = conn.parent.y + NODE_HEIGHT;
                const cx = conn.child.x + NODE_WIDTH / 2;
                const cy = conn.child.y;

                const midY = py + (cy - py) / 2;
                const pathData = `M ${px} ${py} V ${midY} H ${cx} V ${cy}`;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('class', 'tree-line');
                svgLayer.appendChild(path);
            });

            updateTransform();
        }

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
            document.getElementById('zoom-indicator').innerText = `${Math.round(zoom * 100)}%`;
        }

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        function searchNodes(query) {
            matchingNodeIds.clear();
            if (!query.trim()) {
                searchClear.classList.add('hidden');
                renderTree();
                return;
            }

            searchClear.classList.remove('hidden');
            const q = query.toLowerCase();

            function findAndExpand(node) {
                let isMatch = node.title.toLowerCase().includes(q);
                let childMatched = false;

                if (node.children) {
                    node.children.forEach(child => {
                        if (findAndExpand(child)) childMatched = true;
                    });
                }

                if (isMatch) matchingNodeIds.add(node.id);
                if (childMatched) node.expanded = true;

                return isMatch || childMatched;
            }

            findAndExpand(treeData);
            renderTree();
        }

        searchInput.addEventListener('input', (e) => searchNodes(e.target.value));
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchNodes('');
        });

        function setExpandedAll(node, state) {
            if (node.children) {
                node.expanded = state;
                node.children.forEach(child => setExpandedAll(child, state));
            }
        }

        document.getElementById('btn-expand-all').addEventListener('click', () => {
            setExpandedAll(treeData, true);
            renderTree();
        });

        document.getElementById('btn-collapse-all').addEventListener('click', () => {
            setExpandedAll(treeData, false);
            treeData.expanded = true;
            renderTree();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            zoom = 0.8;
            panX = 60;
            panY = 40;
            updateTransform();
        });

        document.getElementById('btn-fit').addEventListener('click', () => {
            const viewportWidth = viewport.clientWidth;
            const treeWidth = treeData.treeWidth || 2800;
            zoom = Math.min(Math.max(viewportWidth / (treeWidth + 180), 0.3), 0.95);
            panX = (viewportWidth - treeWidth * zoom) / 2;
            panY = 30;
            updateTransform();
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            zoom = Math.min(zoom + 0.15, 1.8);
            updateTransform();
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            zoom = Math.max(zoom - 0.15, 0.25);
            updateTransform();
        });

        // Interactive Mouse Pan & Wheel Zoom Events
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node-card')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.08 : -0.08;
            zoom = Math.min(Math.max(zoom + delta, 0.2), 1.8);
            updateTransform();
        }, { passive: false });

        window.onload = function() {
            renderTree();
        };
    </script>
</body>
</html>
